<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Signer</title>
<meta name="description" content="Insert a digital signature into any PDF, entirely on your device.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #61656e;
    --brand: #4f46e5;
    --brand-soft: #eef0fe;
    --shadow: 0 1px 2px rgba(16,19,26,.05), 0 8px 24px rgba(16,19,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319;
      --surface: #191d25;
      --border: #2a2f3a;
      --text: #f2f4f8;
      --muted: #9aa1ae;
      --brand: #8b85f5;
      --brand-soft: #232338;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 460px; }

  header { text-align: center; margin-bottom: 28px; }

  .mark {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--brand);
    color: #fff;
    font-size: 26px;
    box-shadow: var(--shadow);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -.02em;
  }

  .tagline { margin: 0; color: var(--muted); font-size: 15px; }

  .choices { display: grid; gap: 12px; }

  .choice {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  .choice:hover, .choice:focus-visible {
    border-color: var(--brand);
    transform: translateY(-1px);
    outline: none;
  }
  .choice:active { transform: translateY(0); }

  .icon {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: var(--brand-soft);
    font-size: 21px;
  }

  .label { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 13.5px; }

  .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

  .badge {
    position: absolute;
    top: -9px; right: 14px;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  footer a { color: var(--brand); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark" aria-hidden="true">&#9998;</div>
      <h1>PDF Signer</h1>
      <p class="tagline">Add a signature to any PDF &mdash; entirely on your device.</p>
    </header>

    <nav class="choices">
      <a class="choice" id="mobile" href="./Agreement%20pdf-signer%20(Mobile).html">
        <span class="icon" aria-hidden="true">&#128241;</span>
        <span>
          <span class="label">Mobile version</span>
          <span class="sub">Phones and tablets &middot; installable app</span>
        </span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a class="choice" id="desktop" href="./Agreement%20pdf-signer%20(Desktop).html">
        <span class="icon" aria-hidden="true">&#128187;</span>
        <span>
          <span class="label">Desktop version</span>
          <span class="sub">Full layout &middot; more fields and options</span>
        </span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>

    <footer>
      Your files never leave your device &mdash; everything runs in the browser.
    </footer>
  </div>

<script>
  // Flag whichever version suits the current device.
  (function () {
    var coarse = window.matchMedia("(pointer: coarse)").matches;
    var narrow = window.matchMedia("(max-width: 820px)").matches;
    var pick = document.getElementById(coarse || narrow ? "mobile" : "desktop");

    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "Recommended";
    pick.appendChild(badge);

    // Put the recommended one first.
    pick.parentNode.prepend(pick);
  })();
</script>
</body>
</html>
